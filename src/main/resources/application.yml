server:
  port: 8084

spring:
  application:
    name: transactions-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/bankx
  datasource:
    url: jdbc:h2:mem:riskdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2

logging:
  level:
    org.springframework.data.mongodb: info
    org.hibernate.SQL: debug
    reactor.netty: warn
